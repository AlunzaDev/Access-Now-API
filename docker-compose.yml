name: access-now

services:
  postgres:
    image: postgres:17-alpine
    container_name: access-now-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accessnow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accessnow-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-access_now}
    ports:
      # Only reachable from this machine; 5435 avoids clashing with other local Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applies pending Prisma migrations, then exits. The API starts only if it succeeds.
  migrate:
    image: ${MIGRATE_IMAGE:-access-now-api-migrate:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: postgresql://${POSTGRES_USER:-accessnow}:${POSTGRES_PASSWORD:-accessnow-dev-password}@postgres:5432/${POSTGRES_DB:-access_now}
    restart: "no"

  backend:
    container_name: access-now-api
    image: ${BACKEND_IMAGE:-access-now-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${BACKEND_ENV_FILE:-.env.docker}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      PROD: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-accessnow}:${POSTGRES_PASSWORD:-accessnow-dev-password}@postgres:5432/${POSTGRES_DB:-access_now}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  uploads:
